<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="color-scheme" content="dark" />
  <meta
    name="description"
    content="bhai · local — run WebLLM-powered models directly in your browser"
  />
  <title>bhai · local — WebLLM chat</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=IBM+Plex+Sans:wght@400;500&family=IBM+Plex+Mono:wght@400;500&display=swap"
  />

  <link rel="stylesheet" href="/variables.css" />
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <header class="statusbar">
    <span class="wordmark">bhai · local</span>
    <div class="center-container">
      <bhai-model-select
        id="model-select"
        class="model-select"
        placeholder="Select a model…"
      ></bhai-model-select>
      <bhai-provider-cog id="provider-cog"></bhai-provider-cog>
    </div>
    <bhai-status-indicator
      id="status"
      class="status"
      state="cold"
      label="cold"
    ></bhai-status-indicator>
  </header>

  <main class="layout">
    <bhai-conversation
      id="conversation"
      class="conversation"
      aria-live="polite"
    ></bhai-conversation>

    <aside class="telemetry" id="telemetry">
      <!--
        The stats region is re-rendered wholesale after every turn, so anything
        that must survive a turn (the cold-start panel, the MCP panel below)
        lives outside it in its own host.
      -->
      <bhai-cold-start id="cold-start"></bhai-cold-start>

      <bhai-telemetry id="telemetry-stats"></bhai-telemetry>

      <section class="telemetry-panel mcp-panel" id="mcp-panel" aria-labelledby="mcp-panel-title">
        <div class="telemetry-eyebrow" id="mcp-panel-title">MCP servers</div>

        <bhai-mcp-server-list id="mcp-servers"></bhai-mcp-server-list>

        <bhai-mcp-add-form id="mcp-add"></bhai-mcp-add-form>
      </section>
    </aside>
  </main>

  <bhai-mcp-error-dialog id="mcp-error-dialog"></bhai-mcp-error-dialog>

  <bhai-providers-dialog id="providers-dialog"></bhai-providers-dialog>

  <bhai-composer id="composer" class="composer"></bhai-composer>

  <script type="module" src="/src/main.ts"></script>
</body>
</html>
