name: CI

# `push` is scoped to main so a commit on a PR branch triggers exactly one run
# (the pull_request event); pushes to main after a merge are still validated.
on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Install pnpm
        run: npm install -g pnpm@9.15.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Typecheck
        run: pnpm typecheck

      - name: Run lint and quality gates
        run: pnpm lint

      - name: Run tests with coverage
        run: pnpm run test:coverage
